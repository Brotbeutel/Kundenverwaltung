<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Programmablaufplan automatisierter E-Mail-Versand</title>
<desc>Ablauf: Kundendaten laden, Vorlage befüllen, Einwilligung prüfen, E-Mail senden oder überspringen, Ende</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="500" fill="#ffffff"/>

<rect x="270" y="20" width="140" height="40" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="44" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Start</text>
<line x1="340" y1="60" x2="340" y2="98" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="190" y="98" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="122" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Kundendaten aus DB abrufen</text>
<text x="340" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0C447C">SQL-Abfrage</text>
<line x1="340" y1="154" x2="340" y2="192" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="190" y="192" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Vorlage mit Platzhaltern befüllen</text>
<text x="340" y="234" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0C447C">Name, Firma, Anschrift</text>
<line x1="340" y1="248" x2="340" y2="266" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>

<polygon points="340,266 480,326 340,386 200,326" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">Einwilligung</text>
<text x="340" y="338" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#633806">vorhanden?</text>

<line x1="480" y1="326" x2="498" y2="326" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
<text x="486" y="316" font-family="sans-serif" font-size="12" fill="#3d3d3a">ja</text>
<rect x="498" y="298" width="142" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="569" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">E-Mail senden</text>
<text x="569" y="340" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">via SMTP</text>

<line x1="200" y1="326" x2="182" y2="326" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
<text x="150" y="316" font-family="sans-serif" font-size="12" fill="#3d3d3a">nein</text>
<rect x="40" y="298" width="142" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="111" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Kunde überspringen</text>
<text x="111" y="340" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">keine Mail senden</text>

<path d="M569 354 L569 400 L340 400 L340 418" fill="none" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M111 354 L111 400 L340 400" fill="none" stroke="#3d3d3a" stroke-width="0.5"/>

<rect x="270" y="418" width="140" height="40" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="442" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Ende</text>
</svg>
