<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Entity-Relationship-Diagramm Kundenverwaltungssystem</title>
<desc>Tabellen Mitarbeiter, Kunde und Email_Log mit ihren Beziehungen</desc>
<rect width="680" height="480" fill="#ffffff"/>

<!-- MITARBEITER -->
<g font-family="sans-serif">
<rect x="40" y="40" width="220" height="136" rx="8" fill="#ffffff" stroke="#5F5E5A" stroke-width="1"/>
<rect x="40" y="40" width="220" height="26" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<rect x="40" y="53" width="220" height="13" fill="#E6F1FB"/>
<text x="150" y="58" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">mitarbeiter</text>
<text x="52" y="82" font-size="12" fill="#2C2C2A">id</text><text x="200" y="82" font-size="12" fill="#5F5E5A">PK · int</text>
<text x="52" y="104" font-size="12" fill="#2C2C2A">name</text><text x="200" y="104" font-size="12" fill="#5F5E5A">string</text>
<text x="52" y="126" font-size="12" fill="#2C2C2A">email</text><text x="200" y="126" font-size="12" fill="#5F5E5A">string</text>
<text x="52" y="148" font-size="12" fill="#2C2C2A">rolle</text><text x="200" y="148" font-size="12" fill="#5F5E5A">string</text>
<text x="52" y="170" font-size="12" fill="#2C2C2A">passwort_hash</text><text x="212" y="170" font-size="12" fill="#5F5E5A">string</text>
</g>

<!-- KUNDE -->
<g font-family="sans-serif">
<rect x="420" y="40" width="220" height="158" rx="8" fill="#ffffff" stroke="#0F6E56" stroke-width="1"/>
<rect x="420" y="40" width="220" height="26" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<rect x="420" y="53" width="220" height="13" fill="#E1F5EE"/>
<text x="530" y="58" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">kunde</text>
<text x="432" y="82" font-size="12" fill="#2C2C2A">id</text><text x="580" y="82" font-size="12" fill="#5F5E5A">PK · int</text>
<text x="432" y="104" font-size="12" fill="#2C2C2A">vorname</text><text x="580" y="104" font-size="12" fill="#5F5E5A">string</text>
<text x="432" y="126" font-size="12" fill="#2C2C2A">nachname</text><text x="580" y="126" font-size="12" fill="#5F5E5A">string</text>
<text x="432" y="148" font-size="12" fill="#2C2C2A">firma</text><text x="580" y="148" font-size="12" fill="#5F5E5A">string</text>
<text x="432" y="170" font-size="12" fill="#2C2C2A">anschrift</text><text x="580" y="170" font-size="12" fill="#5F5E5A">string</text>
<text x="432" y="192" font-size="12" fill="#2C2C2A">einwilligung_email</text><text x="612" y="192" font-size="12" fill="#5F5E5A">bool</text>
</g>

<!-- EMAIL_LOG -->
<g font-family="sans-serif">
<rect x="230" y="300" width="220" height="136" rx="8" fill="#ffffff" stroke="#993C1D" stroke-width="1"/>
<rect x="230" y="300" width="220" height="26" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<rect x="230" y="313" width="220" height="13" fill="#FAECE7"/>
<text x="340" y="318" text-anchor="middle" font-size="14" font-weight="500" fill="#4A1B0C">email_log</text>
<text x="242" y="342" font-size="12" fill="#2C2C2A">id</text><text x="390" y="342" font-size="12" fill="#5F5E5A">PK · int</text>
<text x="242" y="364" font-size="12" fill="#2C2C2A">kunde_id</text><text x="390" y="364" font-size="12" fill="#5F5E5A">FK · int</text>
<text x="242" y="386" font-size="12" fill="#2C2C2A">mitarbeiter_id</text><text x="390" y="386" font-size="12" fill="#5F5E5A">FK · int</text>
<text x="242" y="408" font-size="12" fill="#2C2C2A">gesendet_am</text><text x="390" y="408" font-size="12" fill="#5F5E5A">datetime</text>
<text x="242" y="430" font-size="12" fill="#2C2C2A">status</text><text x="390" y="430" font-size="12" fill="#5F5E5A">string</text>
</g>

<!-- Relationships -->
<line x1="150" y1="176" x2="230" y2="300" stroke="#3d3d3a" stroke-width="1"/>
<text x="150" y="245" font-size="12" fill="#3d3d3a">versendet (1:n)</text>

<line x1="530" y1="198" x2="450" y2="300" stroke="#3d3d3a" stroke-width="1"/>
<text x="480" y="245" font-size="12" fill="#3d3d3a">erhält (1:n)</text>

<path d="M260 100 L420 100" fill="none" stroke="#3d3d3a" stroke-width="1"/>
<text x="280" y="92" font-size="12" fill="#3d3d3a">verwaltet (1:n)</text>
</svg>
